---
- hosts: "{{ env }}"
  gather_facts: no
  remote_user: devopsadmin
  become: yes
  become_user: oracle
  become_method: sudo
  
  vars_files:
    - ../../ansible_automation_password_vault.yml
  
  vars:
    backup_date: "{{ '%m%d%Y' | strftime }}"
    
  tasks:

    - name: Select a random app server
      set_fact:
        selected_siebel_server_host: "{{ groups['App_Servers'] | random }}"
        
        
    - name: Run task on the selected app server
      ansible.builtin.command: echo "Running on {{ selected_siebel_server_host }}"
      delegate_to: "{{ selected_siebel_server_host }}"
      run_once: true
    
    - name: Print environment and branch name
      debug:
        msg: "Running playbook in Environment: {{ env }}, Repository_Name: {{ Repository_Name }}"
      run_once: true  

    - name: Check if export folder exists
      stat:
        path: /u01/sfs/migration/{{ migrationid }}
      register: export_folder
      run_once: true
      
    - name: Removing existing export folder with same name
      shell: |
        cd /u01/sfs/migration
        rm -r {{ migrationid }}
      when: export_folder.stat.exists and export_folder.stat.isdir
      run_once: true

    - name: Copy Export Folder from Siebel repository to siebel sfs folder
      run_once: true
      copy:
        src: "{{ workspace }}/{{ Repository_Name }}/{{ migrationid }}"
        dest: /u01/sfs/migration
        force: yes
        mode: '0777'
        